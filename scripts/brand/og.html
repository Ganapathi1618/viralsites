<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  body{
    width:1200px;height:630px;background:#fff;
    font-family:"Liberation Sans","DejaVu Sans",sans-serif;color:#0a0a0a;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 84px;box-sizing:border-box;position:relative;
  }
  .rule{position:absolute;left:0;right:0;top:0;height:10px;background:#0066ff}
  .brand{display:flex;align-items:center;gap:18px;margin-bottom:40px}
  .badge{
    width:64px;height:64px;border-radius:16px;background:#0066ff;color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:42px;letter-spacing:-2px;
  }
  .word{font-size:34px;font-weight:700;letter-spacing:-0.5px}
  .word .b{color:#0066ff}
  .word .g{color:#8a8a8a;font-weight:400}
  h1{font-size:66px;line-height:1.06;margin:0 0 26px;font-weight:700;letter-spacing:-2.2px;max-width:960px}
  p{font-size:29px;line-height:1.42;margin:0;color:#404040;max-width:900px}
  .stats{display:flex;gap:56px;margin-top:52px}
  .stat .k{font-size:13px;letter-spacing:2.4px;color:#8a8a8a;text-transform:uppercase;font-weight:700}
  .stat .v{font-size:34px;font-weight:700;margin-top:8px;font-family:"DejaVu Sans Mono",monospace}
  .green{color:#16a34a}
</style></head><body>
  <div class="rule"></div>
  <div class="brand">
    <div class="badge">V</div>
    <div class="word">Viral<span class="b">Sites</span><span class="g">.fyi</span></div>
  </div>
  <h1>Viral one-page money sites, ranked</h1>
  <p>Revenue, model type, launch date — every board in one place.</p>
  <div class="stats">
    <div class="stat"><div class="k">Ranked by</div><div class="v green">Revenue</div></div>
    <div class="stat"><div class="k">Models</div><div class="v">Bid · Pixel · Board</div></div>
    <div class="stat"><div class="k">Updated</div><div class="v">Every 6h</div></div>
  </div>
</body></html>
