# The every-6-hour scrape.
#
# This is the schedule that actually delivers six-hourly runs. vercel.json is
# capped at one run per day because Vercel's Hobby plan rejects any cron more
# frequent than daily — and rejects the whole deployment, not just the cron.
#
# Repository secrets required (Settings -> Secrets and variables -> Actions):
#   SITE_URL     https://viralsites.vercel.app  (no trailing slash)
#   CRON_SECRET  the same value set in the Vercel project env
#
# On Pro: set vercel.json to '0 */6 * * *' and delete this file.
name: scrape

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the scrape endpoint
        run: |
          response=$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/scrape")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "$body"
          test "$status" = "200"
